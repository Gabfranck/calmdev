<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>calmdev</title>
<style>
  :root { --ground: #eff2f2; --text: #131a1b; --muted: #566062; --accent: #17656b; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --ground: #0e1314; --text: #f1f5f5; --muted: #b3bdbd; --accent: #6cc5c5; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: var(--ground); color: var(--text);
    font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  main { display: grid; justify-items: center; gap: 20px; max-width: 460px; padding: 24px; text-align: center; }
  svg { width: 56px; height: 56px; }
  .ring { stroke: var(--text); }
  .dot { fill: var(--accent); transform-origin: 128px 128px; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(.72); } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.02em; }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  code { font: 12px ui-monospace, "SF Mono", Menlo, monospace; color: var(--text); -webkit-user-select: text; user-select: text; }
  body.failed .dot { animation: none; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 256 256" aria-hidden="true"><path class="ring" fill="none" stroke-width="34" stroke-linecap="round" d="M196.37 66.44A92 92 0 1 0 196.37 189.56"/><circle class="dot" cx="128" cy="128" r="30"/></svg>
  <h1 id="title">calmdev démarre</h1>
  <p id="detail">Le serveur local se lance, la page s’ouvre dès qu’il répond.</p>
</main>
<script src="splash.js"></script>
</body>
</html>
