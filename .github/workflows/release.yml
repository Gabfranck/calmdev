# Release (docs/ci.md).
# - On a v* tag: builds the desktop app (desktop/, Tauri) on macOS and attaches the .dmg to a DRAFT GitHub Release.
#   Nothing is published: the developer reads the draft and publishes it by hand on GitHub.
#   Apple signing and notarization run only when the APPLE_* secrets exist; otherwise the .dmg stays unsigned, with a warning.
# - The npm package is published by a separate job, only on a manual run (workflow_dispatch), behind the `release`
#   environment (a required approval is set there) and the NPM_TOKEN secret. A tag never publishes anything to npm.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      npm:
        description: 'Publish the npm package (needs the approval of the release environment)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop .dmg (draft release)
    if: github.repository == 'Gabfranck/calmdev' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # creates the draft release and uploads the .dmg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13'
      - name: Rust toolchain (rustup is on the macOS runner)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: Tauri CLI (desktop/package-lock.json)
        working-directory: desktop
        run: npm ci
      - name: Is Apple signing configured?
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_* secrets absent: the .dmg is built UNSIGNED and not notarized; macOS will ask the user to allow it by hand."
          fi
      - name: Build (signed and notarized)
        if: steps.apple.outputs.signed == 'true'
        working-directory: desktop
        env:
          # Tauri imports the certificate into a temporary keychain, signs, then notarizes when APPLE_ID,
          # APPLE_PASSWORD (an app-specific password) and APPLE_TEAM_ID are set too.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx --no-install tauri build --bundles dmg
      - name: Build (unsigned)
        if: steps.apple.outputs.signed != 'true'
        working-directory: desktop
        run: npx --no-install tauri build --bundles dmg
      - name: Attach the .dmg to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ steps.apple.outputs.signed }}
        run: |
          set -- desktop/src-tauri/target/release/bundle/dmg/*.dmg
          [ -f "$1" ] || { echo "::error::no .dmg under desktop/src-tauri/target/release/bundle/dmg"; exit 1; }
          if [ "$SIGNED" = true ]; then note="Signed and notarized macOS build."; else note="UNSIGNED macOS build: right-click > Open on first launch."; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$@" --clobber
          else
            gh release create "$TAG" "$@" --draft --verify-tag --title "calmdev $TAG" --notes "$note"
          fi

  npm:
    name: npm package (manual, approved)
    if: github.repository == 'Gabfranck/calmdev' && github.event_name == 'workflow_dispatch' && inputs.npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release # the required approval lives here (Settings > Environments > release)
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13'
          registry-url: 'https://registry.npmjs.org'
      - name: A package to publish?
        run: |
          [ -f package.json ] || { echo "::error::no package.json at the root of the repository: nothing to publish"; exit 1; }
          node -e 'const p = require("./package.json"); if (p.private) { console.error("package.json is private"); process.exit(1); } console.log(p.name + "@" + p.version)'
      - name: Tests before publishing
        env:
          CI: 'true'
        run: |
          git config --global user.name 'CI'
          git config --global user.email 'ci@example.invalid'
          git config --global init.defaultBranch main
          node --test 'test/*.test.mjs'
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
