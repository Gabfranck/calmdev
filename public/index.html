<!doctype html>
<html lang="en">
<head>
<script src="/events.js"></script>
<meta charset="utf-8">
<script src="/i18n.js"></script>
<script src="/ux.js"></script>
<script src="/md.js"></script>
<script src="/todo.js"></script>
<script src="/settingintent.js"></script>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#eef2f6" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<script src="/app-window.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>calmdev</title>
<link rel="stylesheet" href="/app.css">
<style>
/* The home (`/`) is the Conversation of the project: public/mainchat.js and mainchat.css. What follows styles the
   planning thread of one escadrille (`/e/:id`): the thread on the left edge, the composer pinned at the foot of the
   sheet, a rail of 360px on the right. Grid at 1440: canvas 1440 - 240 - 8 - 48 = 1144 = thread 760 + 24 + rail 360. */
.chat { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.title-row .back { display: inline-block; margin-bottom: 8px; color: var(--muted); font-size: var(--fs-small); text-decoration: none; } .title-row .back:hover { color: var(--text); } /* « ← Conversation » on a planning thread, as « ← Revue » */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: var(--gap) 24px; align-items: start; }
.cols .main { min-width: 0; display: flex; flex-direction: column; }
.rail { display: grid; gap: var(--gap); position: sticky; top: 16px; min-width: 0; }
.rail .card { min-width: 0; }
.thread { flex: 1; display: grid; gap: 20px; align-content: start; }
/* the facts of the project and of the session: a key-value well, label left, figure right */
.facts { display: grid; min-width: 0; }
.facts .kv { display: flex; justify-content: space-between; gap: 12px; min-height: 32px; align-items: center; min-width: 0; }
.facts .kv + .kv { border-top: 1px solid var(--rule); }
.facts .k { color: var(--muted); flex: none; } .facts .v { font-weight: 500; text-align: right; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.facts .v.dim { color: var(--faint); font-weight: 400; }
.facts .v .pill { margin-left: 4px; }
.card .sub { color: var(--muted); font-size: var(--fs-small); line-height: 16px; min-width: 0; }
.card .sub.path { word-break: break-all; font-family: var(--mono); }
.card .lead-figure { font-size: var(--fs-kpi); line-height: 1.15; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.card .lead-figure small { font-size: 14px; color: var(--muted); margin-left: 4px; }
.usagebar { height: 6px; border-radius: 3px; background: var(--active); overflow: hidden; }
.usagebar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.msg { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; }
.msg .who { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-weight: 600; background: var(--raised); }
.msg.user .who { background: var(--primary); color: var(--primary-ink); }
.msg.claude .who { background: var(--accent-tint); color: var(--accent); }
.msg .body { min-width: 0; padding-top: 7px; }
.msg .meta { color: var(--faint); font-size: var(--fs-small); margin-bottom: 4px; }
.msg .text { line-height: 22px; overflow-wrap: anywhere; } /* the line breaks are <br> already; pre-wrap let trailing spaces hang past the margin on a phone */
.msg .text p { margin: 0 0 10px; } .msg .text p:last-child { margin: 0; }
.msg .text h1, .msg .text h2, .msg .text h3 { font-size: var(--fs-section); font-weight: 600; margin: 14px 0 6px; line-height: 22px; }
.msg .text ul, .msg .text ol { margin: 0 0 10px; padding-left: 22px; } .msg .text li { margin: 2px 0; }
.msg .text code { background: var(--raised); padding: 1px 5px; border-radius: 4px; }
.msg .text pre { margin: 0 0 10px; padding: 10px 12px; background: var(--raised); border-radius: var(--radius-control); overflow: auto; white-space: pre; } .msg .text pre code { background: none; padding: 0; }
.msg .text strong { font-weight: 600; }
.msg.error .text { color: var(--pill-negative-ink); background: var(--pill-negative-bg); padding: 8px 12px; border-radius: var(--radius-control); }
/* what the session is doing, said in one quiet line that replaces itself */
.activity { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; color: var(--muted); font-size: var(--fs-small); line-height: 18px; }
.activity .who { width: 36px; display: grid; place-items: center; height: 18px; }
.activity .who i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: block; }
.activity .who i.off { background: var(--control); }
.activity > div { display: grid; min-width: 0; gap: 2px; }
.activity .lines { display: block; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }
.activity details { min-width: 0; } .activity summary { display: inline-flex; } .activity ol li { overflow-wrap: anywhere; }
.activity ol { margin: 4px 0 0; padding-left: 18px; font-family: var(--mono); }
/* the lead: what the session waits for, read first */
.lead { border: 1px solid var(--border); border-radius: var(--radius-card); padding: var(--card-pad); display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: start; margin-bottom: 4px; }
.lead .badge { width: 40px; height: 40px; border-radius: 8px; background: var(--pill-wait-bg); color: var(--pill-wait-ink); display: grid; place-items: center; font-weight: 600; }
.lead.calm .badge { background: var(--raised); color: var(--muted); }
.lead.done .badge { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
.lead .what { font-weight: 600; font-size: var(--fs-section); line-height: 22px; }
.lead .how { margin-top: 4px; color: var(--muted); line-height: 20px; }
.lead .how b { color: var(--text); font-weight: 500; }
.lead .act { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 860px) { .lead { grid-template-columns: 40px minmax(0, 1fr); } .lead .act { grid-column: 1 / -1; justify-content: flex-start; } }
/* the questions: a form, the recommendation already chosen, a text only where the developer thinks otherwise */
.questions { display: grid; }
.q { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 14px 0; }
.q + .q { border-top: 1px solid var(--rule); }
.q .badge { width: 36px; height: 36px; border-radius: 8px; background: var(--raised); display: grid; place-items: center; font-weight: 600; }
.q .title { font-weight: 600; font-size: var(--fs-section); line-height: 22px; }
.q .ask { margin-top: 2px; line-height: 20px; }
.q .reco { margin-top: 8px; padding: 10px 12px; border-radius: var(--radius-control); background: var(--raised); line-height: 20px; }
.q .reco b { font-weight: 600; }
.q .reco .why { color: var(--muted); display: block; margin-top: 2px; }
.q .choice { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
.q .choice label { display: inline-flex; align-items: center; gap: 8px; min-height: 28px; cursor: pointer; }
.q .choice input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.q textarea.other { width: 100%; min-height: 56px; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--control); border-radius: var(--radius-control); background: var(--surface); color: var(--text); resize: vertical; line-height: 20px; }
.q textarea.other[hidden] { display: none; }
.card .foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.card .foot .tally { color: var(--muted); flex: 1; min-width: 0; }
.asked { color: var(--muted); font-size: var(--fs-small); }
/* who you talk to: the schema */
.schema { display: block; width: 100%; height: auto; margin: 4px 0 0; }
.schema text { font: 500 11px var(--font); fill: var(--text); }
.schema text.m { fill: var(--muted); font-weight: 400; font-size: 11px; }
.schema .box { fill: var(--raised); stroke: var(--border); }
.schema .you { fill: var(--primary); } .schema .you + text { fill: var(--primary-ink); }
.schema .me { fill: var(--accent-tint); stroke: var(--accent); }
.schema .later { fill: none; stroke: var(--control); stroke-dasharray: 3 3; }
.schema .edge { stroke: var(--control); fill: none; }
.schema .edge.on { stroke: var(--accent); }
/* a card; a folded card is one line (what, the one action, « voir ») and its list on demand */
.card { border: 1px solid var(--border); border-radius: var(--radius-card); padding: var(--card-pad); display: grid; gap: 12px; }
.card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card h2 { font-size: var(--fs-section); font-weight: 600; }
.card.fold { padding: 12px var(--card-pad); gap: 0; }
.card.fold .line { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; min-height: 24px; }
.card.fold .line h2 { font-size: var(--fs-body); font-weight: 500; color: var(--muted); flex: 1; min-width: 0; }
.card.fold .line h2 b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.card.fold .line .card-link { color: var(--muted); }
.card.fold.who > summary { font-size: var(--fs-body); min-height: 24px; }
.card.fold.who[open] { gap: 12px; padding-bottom: var(--card-pad); } .card.fold.who[open] > summary { color: var(--text); }
.card.fold .install { margin-top: 8px; border-top: 1px solid var(--rule); }
/* the install list: a checkable list, the why in grey under the name, the how folded */
.install { display: grid; } .install[hidden] { display: none; }
.install .item { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 12px; padding: 10px 0; align-items: start; }
.install .item + .item { border-top: 1px solid var(--rule); }
.install .item label { display: contents; cursor: pointer; }
.install input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); }
.install .name { font-weight: 500; }
.install .why { grid-column: 2; color: var(--muted); } .install details { grid-column: 2; margin-top: 2px; } .install code { display: block; margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--raised); padding: 6px 8px; border-radius: var(--radius-control); }
.estline { display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: baseline; font-variant-numeric: tabular-nums; color: var(--muted); }
.estline b { color: var(--text); font-weight: 600; font-size: var(--fs-section); }
/* the plan card: the formation at a glance, one row per session, the waves as groups */
.formation { display: grid; gap: 4px; }
.formation .wave { color: var(--muted); font-size: var(--fs-small); padding: 10px 0 2px; }
.formation .row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 40px; padding: 4px 0; }
.formation .row + .row { border-top: 1px solid var(--rule); }
.formation .badge { width: 36px; height: 36px; border-radius: 8px; background: var(--raised); display: grid; place-items: center; font-weight: 600; }
.formation .name { font-weight: 500; } .formation .where { color: var(--muted); font-size: var(--fs-small); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.formation .stops { color: var(--muted); font-size: var(--fs-small); white-space: nowrap; }
.card .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
/* the composer */
.composer { position: sticky; bottom: 0; margin-top: 24px; padding: 16px 0 0; background: var(--surface); }
.composer .box { border: 1px solid var(--control); border-radius: var(--radius-card); background: var(--surface); display: grid; }
.composer .box:focus-within { border-color: var(--accent); }
.composer textarea { width: 100%; min-height: 72px; max-height: 320px; padding: 12px 14px 4px; border: 0; background: none; resize: none; line-height: 22px; display: block; }
.composer textarea:focus { outline: 0; }
.composer textarea::placeholder { color: var(--faint); }
.composer .interim { padding: 0 14px; color: var(--muted); min-height: 0; line-height: 20px; font-style: normal; }
.composer .bar { display: flex; align-items: center; gap: 8px; padding: 8px; flex-wrap: wrap; }
.composer .bar .state { flex: 1; color: var(--muted); font-size: var(--fs-small); padding-left: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mic { position: relative; }
.mic[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.mic svg { width: 16px; height: 16px; }
.hintline { color: var(--faint); font-size: var(--fs-small); margin-top: 8px; }
@media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); } .rail { position: static; } }
@media (max-width: 860px) { .canvas { padding: 16px; } .msg .text pre { white-space: pre-wrap; overflow-wrap: anywhere; } .composer { margin-top: 16px; } .title-row h1 { font-size: 20px; } }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Navigation"></nav>
  <div class="frame">
    <div class="topbar"><button class="btn ghost menu-toggle" id="menu" aria-label="Menu" aria-expanded="false">Menu</button><span class="crumb"><span class="proj" id="crumbProj" hidden></span><i aria-hidden="true" hidden>/</i><b id="crumb">Conversation</b></span><span class="spacer"></span><span class="stamp" id="stamp"></span></div>
    <main class="sheet"><div class="canvas chat" id="canvas"></div></main>
  </div>
</div>
<script src="/speech.js"></script>
<script src="/suggest.js"></script>
<script src="/projects.js"></script>
<script src="/sidebar.js"></script>
<script src="/access.js"></script>
<script src="/measure.js"></script>
<script src="/burst.js"></script>
<script src="/team.js"></script>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const when = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : T.time(d); };
const api = (p, body) => fetch(p, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : undefined).then((r) => r.json());
const fmt = (n) => T.num(Number(n || 0));
const NB = '\u202f';
const fmtTokens = (n) => { if (!Number.isFinite(n)) return '–'; if (n >= 1e6) return T.num(n / 1e6, { maximumFractionDigits: 1 }) + NB + 'M'; if (n >= 1e3) return T.num(Math.round(n / 1e3)) + NB + 'k'; return T.num(Math.round(n)); };
const fmtCost = (c) => Number.isFinite(c) ? T.usd(c, c < 10 ? 2 : 0) : '–';
// The plan's total in one line, when the server has estimated it
const estimateLine = (est) => { if (!est || !est.total) return ''; const t = est.total; const cal = est.calibration && est.calibration.calibrated; return `<p class="estline"><span><b>≈ ${fmtTokens(t.tokens)}</b> ${esc(T('esc.tokens'))}</span><span>${fmtCost(t.cost)}</span>${cal ? `<span>${esc(T('esc.weeklyMove', { a: pct(t.weeklyNow), b: pct(t.weeklyAfter) }))}</span>` : `<span>${esc(T('esc.weeklyNone'))}</span>`}</p>`; };
const pct = (x) => T.num(x * 100, { maximumFractionDigits: x < 0.1 ? 1 : 0 }) + ' %';
let MODEL_NAMES = {}; // filled from GET /api/models before the first render
const loadModelNames = () => api('/api/models').then((r) => { MODEL_NAMES = Object.fromEntries((r.models || []).map((m) => [m.id, m.name])); }).catch(() => {});
const STATUS = new Proxy({}, { get: (o, k) => (['thinking', 'waiting', 'planned', 'stopped', 'error'].includes(k) ? T('esc.st.' + k) : undefined) });

// A small markdown for what the session writes: paragraphs, lists, headings, bold, code. Nothing else.
const md = window.escadrilleMd; // public/md.js: paragraphs, lists, tables, code

let escId = location.pathname.startsWith('/e/') ? decodeURIComponent(location.pathname.slice(3)) : null;
let data = null; let meta = null; let es = null; let seen = null;
const canvas = document.getElementById('canvas');

// The home is the Conversation (public/mainchat.js): the old « Nouvelle escadrille » form left in phase 9; a planning
// starts from the Conversation's composer (pilot off), its thread is /e/:id, drawn below.

// The formation: the plan's sessions by wave, one row each
const formation = (p, short) => `<div class="formation">${p.waves.map((w) => `<div class="wave">${esc(w.title)}${w.text ? ' · ' + esc(w.text) : ''}</div>${p.sessions.filter((s) => s.wave === w.n).map((s) => `<div class="row"><div class="badge">${esc(s.id)}</div><div style="min-width:0"><div class="name">${esc(s.name)}</div>${((w) => w ? `<div class="where">${esc(w)}</div>` : '')([short && s.path === p.project ? '' : (s.where || s.path), s.after && s.after.length ? T('esc.after', { list: s.after.join(', ') }) : ''].filter(Boolean).join(' · '))}</div><div class="stops"><span class="pill">${esc(MODEL_NAMES[s.model] || s.model || '')}</span> ${esc(T('esc.stops', { n: s.stops.length }))}</div></div>`).join('')}`).join('')}</div>`;
// The project as the planning session will find it: what it reads before asking anything
let facts = null;
const factsCard = (f) => { if (!f) return `<section class="card" aria-labelledby="facts-h"><header><h2 id="facts-h">${esc(T('esc.project'))}</h2></header><p class="sub">${esc(T('esc.pickFolder'))}</p></section>`;
  if (f.error) return `<section class="card" aria-labelledby="facts-h"><header><h2 id="facts-h">${esc(T('esc.project'))}</h2></header><p class="sub" title="${esc(f.error)}">${esc(T('esc.unread'))}</p></section>`;
  const kv = (k, v, dim) => `<div class="kv"><span class="k">${k}</span><span class="v ${dim ? 'dim' : ''}">${v}</span></div>`;
  const brief = [f.git ? esc(f.branch || 'git') : esc(T('access.noGit')), f.git ? esc(T('access.commits', { n: f.commits || 0 })) : '', f.docs.length ? esc(f.docs.join(', ')) : esc(T('esc.noGuidance')), f.memories ? esc(T('access.notes', { n: f.memories })) : '', f.skills.length ? esc(T('esc.skills', { n: f.skills.length })) : ''].filter(Boolean).join(' · ');
  return `<section class="card" aria-labelledby="facts-h"><header><h2 id="facts-h">${esc(f.name)}</h2><span class="stamp">${f.git && f.lastWhen ? esc(f.lastWhen) : ''}</span></header><p class="sub">${brief}</p><details><summary>${esc(T('esc.detail'))}</summary><p class="sub path" style="margin-top:8px">${esc(f.path)}</p><div class="facts">
    ${f.git ? kv(T('access.branch'), esc(f.branch || '–')) + kv(T('esc.lastCommit'), `<span title="${esc(f.lastCommit)}">${esc(f.lastWhen || '–')}</span>`) + kv(T('esc.commits'), fmt(f.commits)) + kv(T('esc.changed'), f.changed ? fmt(f.changed) : '0', !f.changed) : ''}
    ${kv(T('access.guidance'), f.docs.length ? f.docs.map(esc).join(', ') : esc(T('access.none')), !f.docs.length)}
    ${kv(T('access.memory'), esc(f.memories ? T('access.notes', { n: f.memories }) : T('access.empty')), !f.memories)}
    ${kv(T('access.skills'), f.skills.length ? `<span title="${esc(f.skills.join(', '))}">${f.skills.length > 3 ? fmt(f.skills.length) : esc(f.skills.join(', '))}</span>` : esc(T('access.none')), !f.skills.length)}
    ${f.pkg ? kv(T('access.deps'), fmt(f.pkg.deps)) : ''}
  </div><p class="sub">${esc(T('esc.readsFirst'))}</p></details></section>`; };
// The Rafale view (burst.js, /#rafale) redraws itself; the measure and « À relire » left the home (direction.md §3: the
// status panel and « Ce qui t'attend » carry them)
if (window.escadrilleBurst) escadrilleBurst.onRender(() => { if (!escId && escadrilleBurst.is()) render(); });
// Équipe (docs/team.md): the screen redraws when its data lands; the settings block of Accès too (it reads the same data)
if (window.escadrilleTeam) escadrilleTeam.onRender(() => { if (escId) return; if (escadrilleTeam.is()) render(); else if (isAccess() && access) render(); });
const railHtml = () => (escId && data ? sessionCard() + factsCard(facts) : '');
const loadFacts = async (p) => { if (!p) { facts = null; } else { facts = await fetch('/api/project?path=' + encodeURIComponent(p)).then((r) => r.json()).catch((e) => ({ error: e.message })); } const rail = document.getElementById('rail'); if (rail) rail.innerHTML = railHtml(); };

const composer = (placeholder, label) => `<div class="composer"><div class="box"><textarea id="text" name="text" rows="3" placeholder="${esc(placeholder)}" aria-label="${esc(T('main.msgAria'))}"></textarea><div class="interim" id="interim" aria-live="polite"></div><div class="bar"><button type="button" class="btn mic" id="mic" aria-pressed="false" aria-label="${esc(T('main.dictate'))}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2M5.5 14.5h5"/></svg><span id="micLabel">${esc(T('main.dictate'))}</span></button><span class="state" id="state"></span><button type="submit" class="btn primary" id="send">${esc(label)}</button></div></div><p class="hintline keys"><kbd>${esc(T('main.enter'))}</kbd> ${esc(T('main.sends'))} · <kbd>${esc(T('esc.shift'))}</kbd> <kbd>${esc(T('main.enter'))}</kbd> ${esc(T('esc.shiftEnter'))}</p></div>`;

// ---- the chat of one escadrille
const chatView = () => { const e = data.escadrille; const ms = data.messages; const u = e.usage;
  // The thread: one message per block, the tool calls of one turn folded into one activity line
  let html = ''; let acts = [];
  const flushActs = (live) => { if (!acts.length) return; const last = acts[acts.length - 1]; html += `<div class="activity"><div class="who"><i class="${live ? '' : 'off'}" aria-hidden="true"></i></div><div><span class="lines">${esc(last.text)}</span>${acts.length > 1 ? `<details><summary>${acts.length} lectures</summary><ol>${acts.map((a) => `<li>${esc(a.text)}</li>`).join('')}</ol></details>` : ''}</div></div>`; acts = []; };
  ms.forEach((m, i) => { if (m.role === 'activity') { acts.push(m); return; } flushActs(false);
    if (m.role === 'user') html += `<div class="msg user"><div class="who" aria-hidden="true">${esc(T('esc.you'))}</div><div class="body"><div class="meta">${esc(T('esc.you'))} · ${when(m.at)}</div><div class="text">${md(m.text)}</div></div></div>`;

  if (e.target.closest('#install')) { const items = data.escadrille.install.map((it, k) => ({ ...it, checked: document.querySelector(`#install input[data-k="${k}"]`).checked })); data.escadrille.install = items; await api('/api/escadrille/' + encodeURIComponent(escId) + '/install', { items }); } });
// a memory line is folded to two lines: a click (not a selection, not a link) opens it whole, a second one folds it
document.addEventListener('click', (e) => { const li = e.target.closest && e.target.closest('.memory li[aria-expanded]'); if (!li || e.target.closest('a') || String(getSelection && getSelection())) return; li.setAttribute('aria-expanded', String(li.getAttribute('aria-expanded') !== 'true')); });
// Abandonner a planning (docs/backlog.md, 6 Nov.): POST /api/escadrille/:id/stop, status stopped, back to the Conversation
// where it has left « À toi »; a message on this page would resume it
document.addEventListener('click', async (e) => { const b = e.target.closest && e.target.closest('[data-abandon-esc]'); if (!b) return; b.disabled = true;
  const r = await api('/api/escadrille/' + encodeURIComponent(b.dataset.abandonEsc) + '/stop', {}).catch((x) => ({ error: x.message }));
  if (r.error) { b.disabled = false; return; } location.href = P.withProject('/', data && data.escadrille ? data.escadrille.project : project); });
document.addEventListener('click', (e) => { if (e.target.dataset.focus !== undefined) { const ta = document.getElementById('text'); ta.scrollIntoView({ block: 'center' }); ta.focus(); return; }
  if (e.target.dataset.goto === 'questions') { const el = document.getElementById('questions') || (() => { const lastC = [...data.messages].reverse().find((m) => m.role === 'claude'); return lastC && document.getElementById('m-' + lastC.seq); })(); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
  if (e.target.dataset.accept !== undefined || e.target.id === 'answerAll') { e.target.disabled = true; e.target.textContent = T('esc.sending'); sendText(composeAnswer()); return; }
  if (e.target.dataset.installToggle !== undefined) { installOpen = !installOpen; render(); return; }
  if (e.target.dataset.installAll !== undefined) { const items = data.escadrille.install.map((it) => ({ ...it, checked: true })); data.escadrille.install = items; api('/api/escadrille/' + encodeURIComponent(escId) + '/install', { items }); render(); return; }
  if (e.target.id === 'notify') { Notification.requestPermission().then((p) => { if (p === 'granted') { localStorage.setItem(notifyKey, '1'); e.target.textContent = T('esc.notified'); e.target.setAttribute('aria-pressed', 'true'); } else e.target.textContent = T('esc.notifDenied'); }); return; } });
const autoGrow = () => { const ta = document.getElementById('text'); if (!ta) return; const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(320, ta.scrollHeight) + 'px'; }; ta.addEventListener('input', grow); grow(); };

// ---- dictation: see speech.js
const setupSpeech = () => { const btn = document.getElementById('mic'); if (!btn || btn.disabled) return; attachDictation(document.getElementById('text'), btn, { interim: document.getElementById('interim'), status: document.getElementById('state') }); };

// ---- live
const connect = () => { if (es) es.close(); if (!escId) return;
  es = new EventSource('/api/events?escadrille=' + encodeURIComponent(escId)); es.addEventListener('change', () => { load(); if (window.escadrilleMac) window.escadrilleMac.load(); if (window.escadrillePhone) window.escadrillePhone.load(); }); es.onerror = () => { es.close(); setTimeout(connect, 3000); }; };
// Another language: every view is drawn again from the server, whose texts come in the cookie's language (after
// mainchat.js and pilotlog.js have dropped what they hold)
escadrilleI18n.onChange(() => setTimeout(() => { if (escId) { load(); return; } if (isMemory()) { memory = null; loadMemory(); return; } if (isAccess()) { access = null; loadAccess(); return; } if (window.escadrilleBurst && escadrilleBurst.is()) { escadrilleBurst.load(project); return; } if (window.escadrilleTeam && escadrilleTeam.is()) { escadrilleTeam.load(project); return; } render(); }, 0));
window.addEventListener('popstate', async () => { escId = location.pathname.startsWith('/e/') ? decodeURIComponent(location.pathname.slice(3)) : null; data = null; connect(); if (escId) await load(); else { render(); renderNav(); } });
(async () => { await loadModelNames(); meta = await api('/api/projects'); await renderNav(); setProject(project, false); await loadSettings(); if (escId) { connect(); await load(); } else if (isMemory() || isAccess()) { render(); await (isMemory() ? loadMemory() : loadAccess()); } else if (window.escadrilleTeam && escadrilleTeam.is()) { render(); await escadrilleTeam.load(project); } else { if (window.escadrilleBurst) escadrilleBurst.load(project); render(); renderNav(); } setInterval(() => { if (escId && data && data.escadrille.status === 'thinking') load(); }, 15000); })();
</script>
