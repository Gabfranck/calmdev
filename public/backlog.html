<!doctype html>
<html lang="en">
<head>
<script src="/events.js"></script>
<meta charset="utf-8">
<script src="/i18n.js"></script>
<script src="/ux.js"></script>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#eef2f6" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="bl.title"></title>
<link rel="stylesheet" href="/app.css">
<style>
/* The backlog (docs/backlog-page.md): one action, « Ajouter » an idea; each line checks, moves and joins a plan from
   its own row, the row's tools show on hover and focus (always on the phone); the sections of the file are headings,
   the lines done fold to one line per section. One column, 820 px: a backlog line is read, not scanned. */
.bl .canvas { max-width: 820px; }
.bl form { display: flex; gap: 8px; margin-top: 4px; }
.bl form input { flex: 1; min-width: 0; height: 36px; padding: 0 12px; border: 1px solid var(--control); border-radius: var(--radius-control); background: var(--surface); color: var(--text); font: inherit; }
.bl form .btn { height: 36px; }
.bl .error { margin-top: 12px; color: var(--negative); }
.bl .note { margin-top: 12px; color: var(--positive); }
.bl section { margin-top: 32px; }
.bl section.sub { margin-top: 20px; }
.bl h2 { font-size: var(--fs-section); font-weight: 600; }
.bl h3 { font-size: var(--fs-body); font-weight: 600; color: var(--muted); }
.bl .src { font-size: var(--fs-small); color: var(--faint); overflow-wrap: anywhere; }
.bl ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
.bl li { display: grid; grid-template-columns: 28px 1fr auto; align-items: start; gap: 8px; padding: 8px 8px 8px 4px; border-radius: var(--radius-card); }
.bl li:hover, .bl li:focus-within { background: var(--raised); }
.bl li input[type=checkbox] { width: 16px; height: 16px; margin: 3px 0 0 6px; accent-color: var(--accent); }
.bl .t { line-height: 22px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: text; }
.bl li.open .t { display: block; }
.bl li.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--control); }
.bl .att { display: inline-block; margin-top: 4px; font-size: var(--fs-small); color: var(--accent); text-decoration: none; }
.bl .tools { display: flex; gap: 2px; opacity: 0; transition: opacity var(--t-hover); }
.bl li:hover .tools, .bl li:focus-within .tools { opacity: 1; }
.bl .tools .btn { height: 28px; padding: 0 8px; font-size: var(--fs-small); }
.bl details.folded { margin-top: 4px; }
.bl details.folded summary { color: var(--muted); font-size: var(--fs-small); cursor: pointer; padding: 4px 8px; }
.bl details.more { margin-top: 32px; color: var(--muted); font-size: var(--fs-small); }
.bl dialog { width: min(560px, calc(100vw - 32px)); border: 0; border-radius: var(--radius-sheet); padding: 24px; background: var(--surface); color: var(--text); box-shadow: 0 16px 48px var(--veil); }
.bl dialog::backdrop { background: var(--veil); }
.bl dialog h2 { margin-bottom: 4px; }
.bl dialog .line { color: var(--muted); font-size: var(--fs-small); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bl .plans { margin: 16px 0 0; display: grid; gap: 4px; }
.bl .plans label { display: grid; grid-template-columns: 20px 1fr; gap: 8px; padding: 10px 12px; border-radius: var(--radius-card); background: var(--raised); cursor: pointer; }
.bl .plans label:has(input:checked) { background: var(--accent-tint); }
.bl .plans b { font-weight: 500; }
.bl .plans small { display: block; color: var(--muted); font-size: var(--fs-small); }
.bl .plans .best { color: var(--accent); font-weight: 600; }
.bl dialog .wave { margin-top: 12px; color: var(--muted); font-size: var(--fs-small); }
.bl dialog .act { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
@media (max-width: 860px) {
  .bl .tools { opacity: 1; grid-column: 2 / 4; }
  .bl li { grid-template-columns: 28px 1fr; }
  .bl form .btn { height: 44px; } .bl form input { height: 44px; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Navigation"></nav>
  <div class="frame bl">
    <div class="topbar"><button class="btn ghost menu-toggle" id="menu" data-i18n-attr="aria-label:top.menu" aria-expanded="false" data-i18n="top.menu"></button><span class="crumb"><span class="proj" id="crumbProj" hidden></span><i aria-hidden="true" hidden>/</i><b id="crumb" data-i18n="bl.h"></b></span><span class="spacer"></span></div>
    <main class="sheet">
      <div class="canvas">
        <div class="title-row"><div><h1 data-i18n="bl.h"></h1><p class="sub" id="sub"></p></div></div>
        <form id="form" novalidate>
          <input id="idea" autocomplete="off" data-i18n-attr="placeholder:bl.ph;aria-label:bl.ph">
          <button class="btn primary" type="submit" data-i18n="bl.add"></button>
        </form>
        <p class="error" id="error" role="alert" hidden></p>
        <p class="note" id="note" role="status" hidden></p>
        <div id="list" aria-live="polite"></div>
        <details class="more"><summary data-i18n="bl.where"></summary><p id="where"></p></details>
      </div>
    </main>
  </div>
  <dialog id="pick" aria-labelledby="pickH">
    <form method="dialog" id="pickForm">
      <h2 id="pickH" data-i18n="bl.pick"></h2>
      <p class="line" id="pickLine"></p>
      <div class="plans" id="plans" role="radiogroup"></div>
      <p class="wave" data-i18n="bl.wave"></p>
      <div class="act"><button class="btn ghost" value="cancel" data-i18n="bl.cancel"></button><button class="btn primary" id="pickGo" value="go" data-i18n="bl.confirm"></button></div>
    </form>
  </dialog>
</div>
<script src="/projects.js"></script>
<script src="/sidebar.js"></script>
<script>window.escadrilleSidebar.render(document.getElementById('sidebar'));</script>
<script src="/backlog.js"></script>
</body>
</html>
